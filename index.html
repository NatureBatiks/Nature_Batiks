<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#faf5ec;--card:#fffdf8;--ink:#2b1d14;--mute:#7a6757;--accent:#1f3a5f;--gold:#b8860b;--line:#e6dac6;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1a1410;--card:#241b15;--ink:#f3e9da;--mute:#b3a08c;--accent:#8fb4e3;--gold:#e0b34a;--line:#3a2d23;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1410;--card:#241b15;--ink:#f3e9da;--mute:#b3a08c;--accent:#8fb4e3;--gold:#e0b34a;--line:#3a2d23;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
header{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-size:1.3rem;letter-spacing:.06em;color:var(--gold)}.logo img{height:52px;width:auto}
.hero img{height:150px;width:auto;margin-bottom:8px}
.pay{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:32px}.pay h2{margin:0 0 12px;font-weight:400}.pm{display:flex;gap:10px;flex-wrap:wrap}.pm span{border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:.9rem}.pay pre{white-space:pre-wrap;font:inherit;color:var(--mute);margin:12px 0 0}
.hero{text-align:center;padding:56px 20px;background:
 radial-gradient(circle at 20% 30%,rgba(184,134,11,.18) 0 8px,transparent 9px) 0 0/48px 48px,
 radial-gradient(circle at 70% 70%,rgba(31,58,95,.18) 0 10px,transparent 11px) 0 0/48px 48px}
.hero h1{font-size:clamp(2rem,6vw,3.2rem);margin:0 0 8px;font-weight:400}
.hero p{color:var(--mute);max-width:520px;margin:0 auto}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.img{aspect-ratio:3/4;background:linear-gradient(135deg,var(--accent),var(--gold));background-size:cover;background-position:center;position:relative}
.img.ph{background-image:radial-gradient(circle,rgba(255,255,255,.35) 0 6px,transparent 7px),linear-gradient(135deg,#1f3a5f,#b8860b);background-size:28px 28px,cover}
.tag{position:absolute;top:10px;left:10px;background:#7a1f1f;color:#fff;font-size:.75rem;padding:2px 10px;border-radius:99px}
.info{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.info h3{margin:0;font-weight:400;font-size:1.1rem}
.meta{color:var(--mute);font-size:.85rem}.price{color:var(--gold);font-size:1.1rem}
.btn{background:var(--accent);color:var(--bg);border:0;padding:9px 16px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.del{background:#9b2c2c;color:#fff}
.card .btn{margin-top:auto}
footer{text-align:center;padding:30px 20px;color:var(--mute);border-top:1px solid var(--line);font-size:.9rem}
footer button{background:none;border:0;color:var(--mute);cursor:pointer;text-decoration:underline}
#admin{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:20;padding-top:env(safe-area-inset-top,0px)}
#admin[hidden]{display:none}
.panel{max-width:900px;margin:0 auto;padding:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 3px}
input,textarea,select{width:100%;padding:9px;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.thumb{width:52px;height:68px;border-radius:6px;flex:none;background:var(--accent) center/cover}
.item .grow{flex:1;min-width:0}
.savebar{position:sticky;bottom:0;background:var(--gold);color:#1a1410;padding:10px 16px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.savebar .btn{background:#1a1410;color:#fff}
.gate{max-width:340px;margin:18vh auto;text-align:center}
.err{color:#c0392b;min-height:1.4em}
</style>
</head>

let state={shopName:'Nature Batiks',tagline:'',whatsapp:'',products:[],payments:{}};
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'Rs. '+Number(n||0).toLocaleString('en-US');
const PM=[['cod','Cash on Delivery'],['bank','Bank Transfer'],['card','Card Payment'],['online','Online / LankaQR']];
function payHTML(){const y=state.payments,on=PM.filter(m=>y[m[0]]);if(!on.length)return '';
  return `<section class="pay"><h2>Payment methods</h2><div class="pm">${on.map(m=>`<span>${m[1]}</span>`).join('')}</div>${y.bank&&y.bankDetails?`<pre>${esc(y.bankDetails)}</pre>`:''}<p class="meta">${esc(y.note)}</p></section>`}
function renderShop(){
  document.title=state.shopName;
  const wa=state.whatsapp.replace(/\D/g,'');
  $('#shop').innerHTML=`<header><div class="logo"><img src="${LOGO}" alt="">${esc(state.shopName)}</div><a class="btn alt" href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp us</a></header>
  <section class="hero"><img src="${LOGO}" alt="${esc(state.shopName)} logo"><h1>${esc(state.shopName)}</h1><p>${esc(state.tagline)}</p></section>
  <main class="wrap"><div class="grid">${state.products.map(p=>`<article class="card">
    <div class="img ${p.image?'':'ph'}" ${p.image?`style="background-image:url('${p.image}')"`:''}>${p.stock?'':'<span class="tag">Sold out</span>'}</div>
    <div class="info"><h3>${esc(p.name)}</h3><div class="meta">${esc(p.fabric)}</div><div>${esc(p.desc)}</div><div class="price">${money(p.price)}</div>
    ${p.stock?`<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent('Hi, I am interested in: '+p.name)}">Order on WhatsApp</a>`:''}</div></article>`).join('')||`<p>${state.loaded?'No sarees yet.':'Loading…'}</p>`}</div>${payHTML()}</main>
  <footer>© ${esc(state.shopName)}</footer>`;
}


renderShop();
fetch('data.json?t='+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{state=Object.assign(state,d,{loaded:true});renderShop()}).catch(()=>{state.loaded=true;renderShop()});
</script>
